<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <rect width="64" height="64" fill="#030712"/>
  <!-- Cyber Punk Hair Mohawk Cyan/Pink -->
  <rect x="28" y="4" width="8" height="16" fill="#06b6d4"/>
  <rect x="30" y="6" width="4" height="12" fill="#ec4899"/>
  <!-- Head -->
  <rect x="18" y="18" width="28" height="26" fill="#cbd5e1"/>
  <!-- Cyber Visor / VR Goggles -->
  <rect x="16" y="24" width="32" height="10" fill="#0284c7" stroke="#06b6d4" stroke-width="2"/>
  <line x1="18" y1="29" x2="46" y2="29" stroke="#38bdf8" stroke-width="2"/>
  <!-- Cyborg jaw / respirator -->
  <rect x="24" y="36" width="16" height="8" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="28" cy="40" r="1.5" fill="#22d3ee"/>
  <circle cx="36" cy="40" r="1.5" fill="#22d3ee"/>
  <!-- Cyber jacket with neon collar -->
  <rect x="12" y="46" width="40" height="18" fill="#0f172a"/>
  <line x1="16" y1="46" x2="48" y2="46" stroke="#ec4899" stroke-width="2"/>
</svg>